# radio.ini
# Initialization file for Esp-radio
#
# WiFi mode. Accepted values: b, g, n. Default set to N.
wifi_mode = n
# Clock offset and daylight saving time
clk_server = pool.ntp.org                   # Time server to be used
clk_offset = 3                              # Offset with respect to UTC in hours
clk_dst = 0                                 # Offset during daylight saving time (hours)
#
# Display settings. Accepted values: 
# none, lcd2004, ssd1306, ssd1309, sh1106. Default set to none
display = none
# Rotation (0, 90, 180 or 270) for OLED screens
oledrotation = 0
# Infrared setting. Enabled: 1 for true or 0 for false
ir_enabled = 0
#
# MQTT broker, credentials and topic  to subscribe
mqttbroker = broker.hivemq.com	            # Broker to connect with
mqttport = 1883					            # Portnumber (1883 is default)
mqttuser = none					            # (No) username for broker
mqttpasswd = none				            # (No) password for broker
mqtttopic = espradio				        # Topic for receiving commands
mqttpubtopic = espradioIP			        # IP will be pubished here
#
# WiFi network credentials, may be more than on entry. Strongest signal will be selected.
wifi_00 = NETGEAR-11/xxxxxxx
wifi_01 = ADSL-22/yyyyyyy
#
# VS1053 settings
volume = 70
toneha = 0
tonehf = 0
tonela = 0
tonelf = 0
#
# Presets
preset = 1                                              # Start with preset 1
preset_00 = 109.206.96.34:8100                          #  0 - NAXI LOVE RADIO, Belgrade, Serbia
preset_01 = airspectrum.cdnstream1.com:8114/1648_128    #  1 - Easy Hits Florida 128k
preset_02 = jazz.streamr.ru/jazz-64.mp3                 #  2 - Radio Jazz
preset_03 = airspectrum.cdnstream1.com:8078/1614_192	#  3 - Smooth Jazz New York
preset_04 = live2.playradio.org:9090/FMmobile           #  4 - Play 90s
preset_05 = sc.brtk.net:8008/stream/1/                  #  5 - BAYRAK HABER
preset_06 = live4.radyotvonline.com:8160/;              #  6 - Radyo Spor
preset_07 = orion.shoutca.st:8554/stream	            #  7 - Radio Digital Impulse
preset_08 = n0c.radiojar.com/hcrb063nn3quv              #  8 - Radio Svoboda
preset_09 = noasrv.caster.fm:10034/stream               #  9 - Echo FM Online
preset_10 = ihr/IHR_IEDM                                # 10 - iHeartRadio IHR_IEDM
preset_11 = ihr/IHR_TRAN                                # 11 - iHeartRadio IHR_TRAN
preset_12 = ihr/WQTR                                    # 12 - iHeartRadio WQTR (404)
preset_13 = ihr/CKMXAM                                  # 13 - iHeartRadio CKMXAM (453)
# End of file
